[project]
name = "agileops-prod-console"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "openpyxl"]

[dependency-groups]
dev = ["pytest"]

# --- Herramientas de calidad (equipo cliente: ruff 0.16.9, ver dev-report.txt) ---
# pip NO lee estos grupos: para instalar usa requirements-dev.txt
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Reglas explicitas (las mismas del tipico setup de ruff) para que el
# resultado sea identico en cualquier version de ruff del equipo cliente.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]